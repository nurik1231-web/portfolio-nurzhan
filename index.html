<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF8;
    --surface: #F2F1EC;
    --ink: #17181A;
    --ink-soft: #6B6B66;
    --line: #DEDCD3;
    --accent: #2D4FE0;
    --radius: 3px;
    --maxw: 720px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  a{color:inherit;}

  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 24px; }

  header{ padding:28px 0 20px; }
  .header-row{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-size:15px; font-weight:500; letter-spacing:-0.01em; }
  nav{ display:flex; gap:22px; }
  nav a{ text-decoration:none; font-size:14px; color:var(--ink-soft); transition:color .15s ease; }
  nav a:hover{color:var(--ink);}

  .hero{ padding:64px 0 56px; }
  .hero h1{
    font-size:40px; line-height:1.15; letter-spacing:-0.02em; margin:0 0 14px;
    font-weight:700; max-width:14ch;
  }
  .hero .role{ font-size:17px; color:var(--ink-soft); margin:0 0 18px; max-width:52ch; }
  .hero .links{ display:flex; gap:18px; flex-wrap:wrap; }
  .hero .links a{ font-size:14px; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  .hero .links a:hover{border-color:var(--ink);}

  section{padding:8px 0 56px;}
  section h2{ font-size:22px; font-weight:600; letter-spacing:-0.01em; margin:0 0 24px; }

  .project{
    display:grid; grid-template-columns:64px 1fr auto; gap:20px;
    padding:22px 0; border-top:1px solid var(--line); align-items:start;
  }
  .project:last-child{border-bottom:1px solid var(--line);}
  .project .year{ font-size:13px; color:var(--ink-soft); padding-top:2px; }
  .project .body h3{ margin:0 0 6px; font-size:17px; font-weight:600; }
  .project .body p{ margin:0 0 12px; color:var(--ink-soft); font-size:14.5px; max-width:56ch; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{ font-size:12px; color:var(--ink-soft); background:var(--surface); padding:3px 8px; border-radius:var(--radius); }
  .project .link{ font-size:13px; text-decoration:none; color:var(--accent); white-space:nowrap; padding-top:2px; }
  .project .link:hover{text-decoration:underline;}

  .about p{ max-width:62ch; color:var(--ink-soft); font-size:15px; margin:0 0 18px; }
  .skills{ display:flex; flex-wrap:wrap; gap:8px; }

  footer{
    border-top:1px solid var(--line); padding:24px 0 40px; display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  footer .copy{ font-size:13px; color:var(--ink-soft); }
  footer .links{ display:flex; gap:16px; }
  footer a{ font-size:13px; text-decoration:none; color:var(--ink-soft); }
  footer a:hover{color:var(--ink);}

  .empty{ color:var(--ink-soft); font-size:14px; padding:24px 0; }

  @media (max-width:560px){
    .hero h1{font-size:32px; max-width:none;}
    .project{grid-template-columns:1fr; gap:6px;}
    .project .year{order:-1;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-row">
      <div class="brand mono" id="brandName">yourname</div>
      <nav>
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero" id="hero">
    <h1 id="heroName">Your Name</h1>
    <p class="role" id="heroRole">Software engineer building fast, considered products for the web.</p>
    <div class="links" id="heroLinks">
      <a href="mailto:you@example.com" id="heroEmail">you@example.com</a>
      <a href="#" id="heroGithub">GitHub</a>
      <a href="#" id="heroResume">Resume</a>
    </div>
  </section>

  <section id="work">
    <h2>Projects</h2>
    <div id="projectList"></div>
  </section>

  <section id="about">
    <h2>About</h2>
    <div class="about">
      <p id="aboutBio">A short bio goes here.</p>
      <div class="skills" id="aboutSkills"></div>
    </div>
  </section>

  <footer id="contact">
    <div class="copy mono" id="footerCopy">&copy; 2026</div>
    <div class="links" id="footerLinks">
      <a href="mailto:you@example.com" id="footerEmail">Email</a>
      <a href="#" id="footerGithub">GitHub</a>
    </div>
  </footer>
</div>

<script>
(function(){
  const el = (id) => document.getElementById(id);

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function fetchJson(path, fallback){
    try{
      const res = await fetch(path);
      if(!res.ok) throw new Error('fetch failed');
      return await res.json();
    }catch(e){
      console.warn('Could not load', path, '— check the file exists and you are running a local server, not opening this file directly.');
      return fallback;
    }
  }

  function renderProfile(profile){
    el('brandName').textContent = profile.brand || 'yourname';
    el('heroName').textContent = profile.name || 'Your Name';
    el('heroRole').textContent = profile.role || '';
    el('heroEmail').textContent = profile.email || '';
    el('heroEmail').href = 'mailto:' + (profile.email || '');
    el('heroGithub').href = profile.github || '#';
    el('heroResume').href = profile.resume || '#';
    el('aboutBio').textContent = profile.bio || '';
    el('aboutSkills').innerHTML = (profile.skills || []).map(s =>
      `<span class="tag mono">${escapeHtml(s)}</span>`).join('');
    el('footerCopy').textContent = '\u00A9 ' + (profile.year || '2026');
    el('footerEmail').href = 'mailto:' + (profile.email || '');
    el('footerGithub').href = profile.github || '#';
  }

  function renderProjects(projects){
    const list = el('projectList');
    if(!projects || projects.length === 0){
      list.innerHTML = `<div class="empty">No projects yet.</div>`;
      return;
    }
    list.innerHTML = projects.map(p => `
      <div class="project">
        <div class="year mono">${escapeHtml(p.year)}</div>
        <div class="body">
          <h3>${escapeHtml(p.title)}</h3>
          <p>${escapeHtml(p.description)}</p>
          <div class="tags">${(p.tags||[]).map(t=>`<span class="tag mono">${escapeHtml(t)}</span>`).join('')}</div>
        </div>
        <a class="link" href="${escapeHtml(p.link)}" target="_blank" rel="noopener">View \u2197</a>
      </div>
    `).join('');
  }

  async function init(){
    const [profile, projects] = await Promise.all([
      fetchJson('data/profile.json', {}),
      fetchJson('data/projects.json', [])
    ]);
    renderProfile(profile);
    renderProjects(projects);
  }

  init();
})();
</script>

</body>
</html>
